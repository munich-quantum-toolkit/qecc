name: Templating
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/templating.yml"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  render-template:
    name: Render template
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - id: create-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # Needed to push the templating branch
          permission-pull-requests: write # Needed to open the templating pull request
      - uses: munich-quantum-toolkit/templates@a0f93d5fad788ca615e2b36043846fe3f200b9be # v1.7.0
        env:
          PREK_SKIP: ty
        with:
          token: ${{ steps.create-token.outputs.token }}
          name: QECC
          organization: ${{ github.repository_owner }}
          project-type: pure-python
          repository: ${{ github.event.repository.name }}
          has-changelog-and-upgrade-guide: false
