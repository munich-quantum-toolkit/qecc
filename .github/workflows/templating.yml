name: Templating
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/templating.yml"
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  render-template:
    name: Render template
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - id: create-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # Needed to push the templating branch
          permission-pull-requests: write # Needed to open the templating pull request
      - uses: munich-quantum-toolkit/templates@cf0390a674091c1a428c5c59b90d48c7a38dd51c # v1.6.0
        env:
          PREK_SKIP: ty
        with:
          token: ${{ steps.create-token.outputs.token }}
          name: QECC
          organization: ${{ github.repository_owner }}
          project-type: pure-python
          repository: ${{ github.event.repository.name }}
          has-changelog-and-upgrade-guide: false
