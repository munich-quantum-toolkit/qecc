[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs>=0.4", "hatchling>=1.27" ]


[project]
name = "mqt-qecc"
description = "MQT QECC - Tools for Quantum Error Correcting Codes"
readme = "README.md"
keywords = [ "error-correction", "MaxSAT", "MQT", "QLDPC", "quantum-computing" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "bposd>=1.6",
  "ldpc>=2.3.10",
  "matplotlib>=3.7.1",
  "matplotlib>=3.8; python_version>='3.12'",
  "matplotlib>=3.10.5; python_version>='3.14'",
  "matplotlib>=3.10; python_version>='3.13'",
  "multiprocess>=0.70.17",
  "multiprocess>=0.70.19; python_version>='3.14'",
  "networkx>=3.4.2",
  "numba>=0.57",
  "numba>=0.59; python_version>='3.12'",
  "numba>=0.61; python_version>='3.13'",
  "numba>=0.63.1; python_version>='3.14'",
  "numpy>=1.24.1",
  "numpy>=1.26; python_version>='3.12'",
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "pymatching>=2.2.2",
  "pymatching>=2.4; python_version>='3.14'",
  "qecsim>=1.0b9",
  "qiskit[qasm3-import]>=2.1",
  "scipy>=1.15.2",
  "scipy>=1.16.1; python_version>='3.14'",
  "sinter>=1.14",
  "stim>=1.14",
  "tqdm>=4.66.2",
  "z3-solver>=4.15.3",
]

[[project.authors]]
name = "Lucas Berent"
email = "lucas.berent@tum.de"

[[project.authors]]
name = "Lukas Burgholzer"
email = "lukas.burgholzer@tum.de"

[[project.authors]]
name = "Peter-Jan H. S. Derks"
email = "peter-janderks@hotmail.com"

[[project.authors]]
name = "Timo Hillmann"
email = "timo.hillmann@rwth-aachen.de"

[[project.authors]]
name = "Tom Peham"
email = "tom.peham@tum.de"

[[project.authors]]
name = "Ludwig Schmid"
email = "ludwig.s.schmid@tum.de"

[project.optional-dependencies]
qsample = [
  "fastcore>=1.8.1",
  "qsample>=0.0.2",
  "urllib3>=2.3",
]

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/qecc"
Documentation = "https://mqt.readthedocs.io/projects/qecc"
Issues = "https://github.com/munich-quantum-toolkit/qecc/issues"
Discussions = "https://github.com/munich-quantum-toolkit/qecc/discussions"

[project.scripts]
"mqt.qecc.cc-decoder" = "mqt.qecc.cc_decoder.cli:cli"
"mqt.qecc.cc-decoder-plot" = "mqt.qecc.cc_decoder.plots:main"


[dependency-groups]
dev = [
  { include-group = "test" },
  "nox>=2025.11.12",
]
test = [
  "pytest>=9.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.14",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]
docs = [
  "furo>=2025.12.19",
  "ipywidgets>=8.1.7",
  "myst-nb>=1.4",
  "qiskit[qasm3-import,visualization]>=2.1",
  "sphinx>=9",
  "sphinx-autoapi>=3.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mqt/qecc/_version.py"

[tool.hatch.build.targets.wheel]
packages = [ "src/mqt" ]


[tool.uv]
required-version = ">=0.5.20"
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
  "sys_platform == 'win32' and platform_machine != 'arm64'",
]

[tool.uv.sources]
mqt-qecc = { workspace = true }


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [ "ANN", "T20" ]
"docs/**" = [ "T20" ]
"noxfile.py" = [ "T20", "TID251" ]
"*.pyi" = [ "D" ]  # pydocstyle
"*.ipynb" = [
  "D",    # pydocstyle
  "E402", # Allow imports to appear anywhere in Jupyter notebooks
  "I002", # Allow missing `from __future__ import annotations` import
]
"*/cc_decoder/plots.py" = [ "T201" ]
"scripts/*" = [ "T201" ]
"lifted_hgp.py" = [ "EXE002" ]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.qecc" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
extend-select = [
  "A",      # flake8-builtins
  "ANN",    # flake8-annotations
  "ARG",    # flake8-unused-arguments
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FA",     # flake8-future-annotations
  "FLY",    # flynt
  "FURB",   # refurb
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging-format
  "N",      # flake8-naming
  "NPY",    # numpy
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID251", # flake8-tidy-imports.banned-api
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
]
ignore = [
  "ISC001",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR1702", # Too many nested blocks
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
sdist-only = [
  "src/mqt/qecc/_version.py",
]


[tool.check-wheel-contents]
ignore = [ "W002" ]  # Triggers on __init__.py's and duplicate data files


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default.extend-words]
wille = "wille"
ser = "ser"
aer = "aer"
anc = "anc"
arange = "arange"
nd = "nd"
strat = "strat"
iz = "iz"


[tool.ty.src]
exclude = [
  "**/*.ipynb",
  "docs/**",
  "scripts/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--showlocals",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
  "--dist=loadgroup",    # Ensure that certain tests are run on the same worker
]
filterwarnings = [
  "error",
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('.+'\\)`\\.:DeprecationWarning",
  "ignore::DeprecationWarning:.*(simpleeval).*",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "tests" ]


[tool.coverage]

[tool.coverage.run]
source = [ "mqt.qecc" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  "@overload",                 # Overloads are only for static typing
  '\.\.\.',
  "def __dir__()",             # Ignore __dir__ method that exists mainly for better IDE support
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]
